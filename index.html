<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FDFBF7" />

  <!-- ============================================================
       SEO BÁSICO
       El <title> y la description se actualizan por ruta desde
       router.js (useDocumentMeta). Estos son los valores por defecto
       que ve un buscador o un bot de redes sociales.
  ============================================================ -->
  <title>Rosa Sandoval Polanco — Personas que crecen. Decisiones que transforman.</title>
  <meta name="description"
    content="Te acompaño a desarrollar una relación más consciente con el dinero, contigo misma y con los resultados que quieres construir. Educación financiera, desarrollo personal y liderazgo, para personas y organizaciones." />
  <meta name="author" content="Rosa Sandoval Polanco" />

  <!-- Open Graph / redes sociales -->
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="es_DO" />
  <meta property="og:site_name" content="Rosa Sandoval Polanco" />
  <meta property="og:title" content="Rosa Sandoval Polanco — Aquí conectamos" />
  <meta property="og:description"
    content="Educación financiera, desarrollo personal y liderazgo. Metodología GPS de la Abundancia®: Ser, Hacer y Tener. Mentoría individual y programas para empresas." />
  <!-- ⚠️ PENDIENTE: reemplazar por una imagen 1200×630 px diseñada para
       compartir. Debe ser una URL ABSOLUTA para que Facebook, LinkedIn
       y WhatsApp la lean; las rutas relativas no funcionan en OG. -->
  <meta property="og:image" content="https://rosasandoval.com/images/rosa-sandoval.jpg" />
  <meta property="og:image:alt" content="Rosa Sandoval Polanco" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Rosa Sandoval Polanco — Aquí conectamos" />
  <meta name="twitter:description"
    content="Educación financiera, desarrollo personal y liderazgo. Metodología GPS de la Abundancia®." />

  <link rel="icon" type="image/png" href="./logo.png" />

  <!-- ============================================================
       FUENTES
       Las familias reales del sitio (Fraunces, Newsreader, Inter Tight,
       JetBrains Mono) se importan desde src/index.css.
       Aquí solo abrimos la conexión con antelación para que la
       descarga empiece antes: ahorra ~100 ms en el primer render.
  ============================================================ -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
